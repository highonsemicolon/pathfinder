apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/highonsemicolon/pathfinder.git
    targetRevision: main
    path: gitops/infrastructure/authentik

  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true